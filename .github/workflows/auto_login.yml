name: SlimeNodes Auto Login & Renew

on:
  schedule:
    # 默认每5天的 UTC 00:00 运行一次
    - cron: '0 0 */5 * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装中文字体 (解决截图乱码与点击定位问题)
        run: sudo apt-get install -y fonts-noto-cjk

      - name: 安装 Playwright 及依赖库
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 运行主逻辑脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SLIMENODES_COOKIE: ${{ secrets.SLIMENODES_COOKIE }}
        run: |
          python main.py

      - name: 更新 Cookie 到 GitHub Secrets
        if: success()
        env:
          # 注意：这里需要你之前申请的带 repo 权限的 PAT Token
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f "new_cookie.txt" ]; then
            NEW_COOKIE=$(cat new_cookie.txt)
            gh secret set SLIMENODES_COOKIE -b"$NEW_COOKIE"
            echo "✅ 最新的 Cookie 已经被成功更新到 GitHub Secrets 中！"
          else
            echo "▶ 没有生成新的 Cookie（使用的是原有且有效的 Cookie）。"
          fi

      - name: 上传调试截图
        if: always() # 无论成功失败，都打包上传截图，方便排查
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-screenshots
          path: '*.png'
          retention-days: 7
