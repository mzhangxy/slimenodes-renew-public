name: SlimeNodes Auto Login & Renew

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Playwright 及依赖库
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 运行主逻辑脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SLIMENODES_COOKIE: ${{ secrets.SLIMENODES_COOKIE }}
        run: |
          python main.py

      - name: 更新 Cookie 到 GitHub Secrets
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f "new_cookie.txt" ]; then
            NEW_COOKIE=$(cat new_cookie.txt)
            gh secret set SLIMENODES_COOKIE -b"$NEW_COOKIE"
            echo "✅ Cookie 已经被成功更新到 GitHub Secrets 中！"
          else
            echo "▶ 没有生成新的 Cookie（使用的是原有且有效的 Cookie）。"
          fi

      # 新增：上传截图（无论前面步骤成功还是失败都会执行）
      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-screenshots
          path: '*.png'
          retention-days: 7
